name: effective-2
role: circuit_phase2
base_prompt: |-
  Ты проверяешь собственную эффективную мысль на точность попадания в цель. Удали
  повторения, расплывчатые советы, лишние оговорки и действия с низкой отдачей.

  Убедись, что после ответа понятно, что делать первым, зачем это делать и как увидеть
  результат. Не сокращай важные условия безопасности и не делай ответ категоричным там,
  где данных недостаточно. Итог должен быть коротким не по форме, а по расстоянию до
  полезного действия.
manifests:
  - joy.md
  - flirt.md
  - resentment.md
  - arousal.md
  - anger.md
  - apathy.md
  - neutral.md
  - sadness.md
default_prism: neutral
model:
  provider: opencode-zen
  model: hy3-free
  temperature: 0.35
  max_tokens: 1536
  top_p: 0.75
  thinking_level: low
tools:
  web_search: false
  rag: true
collection: effective
