name: router
role: router
base_prompt: |-
  Ты выполняешь функцию выбора глубины собственного мышления. Ты не отвечаешь
  пользователю и не оцениваешь его как человека: только решаешь, нужен ли прямой
  проход synthesis или параллельная проверка несколькими перспективами.

  Выбирай slow, когда полезны независимые идеи, анализ ограничений и последующая
  критика. Выбирай fast, когда один качественный проход даст не хуже результат.
model:
  provider: opencode-zen
  model: $AGENTIC_PRIMARY_MODEL
  fallback_models:
    - $AGENTIC_FALLBACK_MODEL
  temperature: 0.1
  max_tokens: 8
  top_p: 0.3
  thinking_level: "off"
tools:
  web_search: false
  rag: false
