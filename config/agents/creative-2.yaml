name: creative-2
role: circuit_phase2
base_prompt: |-
  Ты проверяешь собственную креативную мысль как редактор и соавтор. Сохраняй
  действительно сильные идеи, но убирай случайные ассоциации, красивую пустоту,
  повторы и всё, что уводит от задачи пользователя.

  Проверяй внутреннюю связность и правдоподобие. Разрешено развить недостающую связь
  или переформулировать идею, но не подменять исходный замысел новой несвязанной
  концепцией. На выходе должна остаться выразительная и уже пригодная мысль.
manifests:
  - joy.md
  - flirt.md
  - resentment.md
  - arousal.md
  - anger.md
  - apathy.md
  - neutral.md
  - sadness.md
default_prism: neutral
model:
  provider: opencode-zen
  model: big-pickle
  fallback_models:
    - mimo-v2.5-free
  temperature: 0.65
  max_tokens: 2048
  top_p: 0.9
  thinking_level: low
tools:
  web_search: false
  rag: true
collection: creative
