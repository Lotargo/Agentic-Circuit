[project]
name = "agentic-circuit"
version = "0.2.0"
description = "Multi-perspective agent runtime with isolated long-term memory and hybrid retrieval"
requires-python = ">=3.12,<3.14"
dependencies = [
    "langgraph>=0.2.0,<2",
    "pydantic>=2.7.0,<3",
    "pyyaml>=6.0,<7",
    "httpx>=0.27.0,<1",
    "openai>=1.40.0,<3",
    "qdrant-client>=1.10.0,<2",
    "fastapi>=0.110.0,<1",
    "uvicorn>=0.30.0,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0,<10",
    "pytest-asyncio>=0.23.0,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_circuit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
