[project]
name = "agentic-circuit"
version = "0.1.0"
description = "Multi-agent agentic circuit (chat-openwebui): router + parallel circuits + synthesis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.0",
    "langserve>=0.3.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "openai>=1.40.0",
    "qdrant-client>=1.10.0",
    "pymongo>=4.8.0",
    "langsearch>=0.1.0",
    "llama-index>=0.10.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "sse-starlette>=2.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_circuit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
