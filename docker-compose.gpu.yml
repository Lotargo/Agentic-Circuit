# Optional NVIDIA override:
# docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
#
# Override TEI_IMAGE/RERANK_IMAGE for the GPU architecture when needed.

services:
  tei-embedding:
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cuda-1.9}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  tei-rerank:
    image: ${RERANK_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cuda-1.9}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
