name: Update Python lock

on:
  push:
    branches: [main]
    paths:
      - src/py-engine/pyproject.toml
      - .github/workflows/update-python-lock.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade uv
      - name: Generate lockfile
        working-directory: src/py-engine
        run: uv lock
      - name: Commit lockfile
        run: |
          if git diff --quiet -- src/py-engine/uv.lock && git ls-files --error-unmatch src/py-engine/uv.lock >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/py-engine/uv.lock
          git commit -m "build: update Python lockfile"
          git push
