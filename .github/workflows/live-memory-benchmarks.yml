name: Live memory benchmarks

on:
  workflow_dispatch:
    inputs:
      longmemeval_cases:
        description: Balanced LongMemEval-S subset size
        required: false
        default: "6"
      locomo_cases:
        description: Balanced LoCoMo-10 QA subset size
        required: false
        default: "8"
      seed:
        description: Deterministic sampling seed
        required: false
        default: "20260714"
  pull_request:
    branches:
      - main
  schedule:
    # GitHub cron cannot express an exact 72-hour interval. A tiny daily gate below
    # runs the expensive job only when the UTC date is three days from the anchor.
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: live-memory-benchmarks
  # Serialize expensive runs, but never cancel one that is already producing metrics.
  cancel-in-progress: false

jobs:
  cadence:
    name: Three-day cadence gate
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - id: gate
        name: Decide whether to run
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today_days=$(( $(date -u +%s) / 86400 ))
          anchor_days=$(( $(date -u -d '2026-07-15 00:00:00 UTC' +%s) / 86400 ))
          if [ $(( (today_days - anchor_days) % 3 )) -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  benchmark:
    name: LongMemEval, LoCoMo and memory safety
    needs: cadence
    if: needs.cadence.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
      DATABASE_DIRECT_URL: ${{ secrets.DATABASE_DIRECT_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CONFIG_DIR: ${{ github.workspace }}/config
      QDRANT_URL: http://127.0.0.1:6633
      EMBEDDING_SIDECAR_URL: http://127.0.0.1:8899
      RERANK_SIDECAR_URL: http://127.0.0.1:8898
      EMBEDDING_MODEL: intfloat/multilingual-e5-small
      EMBEDDING_VECTOR_SIZE: "384"
      RERANK_MODEL: Alibaba-NLP/gte-multilingual-reranker-base
      BENCH_CACHE_DIR: ${{ github.workspace }}/.cache/benchmark-data
      BENCH_OUTPUT_DIR: ${{ github.workspace }}/benchmark-results/live
      BENCH_LONGMEMEVAL_CASES: ${{ inputs.longmemeval_cases || '6' }}
      BENCH_LOCOMO_CASES: ${{ inputs.locomo_cases || '8' }}
      BENCH_SEED: ${{ inputs.seed || '20260714' }}
      BENCH_FALLBACK_MODEL: deepseek-v4-flash-free
      BENCH_JUDGE_MODEL: deepseek-v4-flash-free
      BENCH_REGISTRY_CATEGORY: live-memory-adapted-v1
      # External scores and live extraction cases are informational until a baseline
      # exists. A separate deterministic checker below still blocks leakage regressions.
      BENCH_STRICT_SAFETY: "false"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify required secrets
        shell: bash
        run: |
          test -n "$OPENCODE_ZEN_API_KEY" || {
            echo "OPENCODE_ZEN_API_KEY is not configured in GitHub Actions secrets"
            exit 1
          }
          database_url="${DATABASE_DIRECT_URL:-${DATABASE_URL:-}}"
          test -n "$database_url" || {
            echo "DATABASE_DIRECT_URL or DATABASE_URL is not configured in GitHub Actions secrets"
            exit 1
          }
          echo "::add-mask::$OPENCODE_ZEN_API_KEY"
          [ -n "${DATABASE_DIRECT_URL:-}" ] && echo "::add-mask::$DATABASE_DIRECT_URL"
          [ -n "${DATABASE_URL:-}" ] && echo "::add-mask::$DATABASE_URL"

      - name: Configure Experiment A provider chain
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          fallback = os.environ["BENCH_FALLBACK_MODEL"]
          old = "    - mimo-v2.5-free"
          new = f"    - {fallback}"
          targets = [
              Path("config/agents/memory.yaml"),
              Path("config/agents/synthesis.yaml"),
          ]
          for path in targets:
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise RuntimeError(
                      f"expected exactly one MiMo fallback in {path}, found {text.count(old)}"
                  )
              path.write_text(text.replace(old, new), encoding="utf-8")
              print(f"{path}: big-pickle -> {fallback}")

          providers = Path("config/providers.yaml").read_text(encoding="utf-8")
          if f"      - {fallback}" not in providers:
              raise RuntimeError(f"benchmark fallback model is not declared: {fallback}")
          PY

      - name: Restore benchmark and model caches
        uses: actions/cache@v6
        with:
          path: |
            .cache/benchmark-data
            .cache/tei-embedding
            .cache/tei-rerank
          key: live-memory-bench-v2-${{ runner.os }}-e5-small-gte-reranker
          restore-keys: |
            live-memory-bench-v2-${{ runner.os }}-

      - name: Install locked Python environment
        run: |
          python -m pip install --upgrade uv
          cd src/py-engine
          uv sync --frozen --extra test

      - name: Start Qdrant and TEI services
        run: |
          mkdir -p .cache/tei-embedding .cache/tei-rerank
          docker run -d --name bench-qdrant \
            -p 6633:6333 \
            qdrant/qdrant:latest
          docker run -d --name bench-embedding \
            -p 8899:80 \
            -e MODEL_ID="$EMBEDDING_MODEL" \
            -v "$GITHUB_WORKSPACE/.cache/tei-embedding:/data" \
            ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
          docker run -d --name bench-rerank \
            -p 8898:80 \
            -e MODEL_ID="$RERANK_MODEL" \
            -v "$GITHUB_WORKSPACE/.cache/tei-rerank:/data" \
            ghcr.io/huggingface/text-embeddings-inference:cpu-1.9

      - name: Wait for model downloads and retrieval services
        timeout-minutes: 35
        shell: bash
        run: |
          set -u
          ready=0
          echo "First run may take several minutes while TEI downloads and loads both models."

          for i in {1..180}; do
            for container in bench-qdrant bench-embedding bench-rerank; do
              state=$(docker inspect --format '{{.State.Status}}' "$container" 2>/dev/null || echo missing)
              if [ "$state" != "running" ]; then
                echo "::error::$container is not running (state=$state)"
                docker inspect "$container" || true
                docker logs --tail 200 "$container" || true
                exit 1
              fi
            done

            qdrant_ready=0
            embedding_ready=0
            rerank_ready=0
            curl -fs --max-time 2 http://127.0.0.1:6633/readyz >/dev/null 2>&1 && qdrant_ready=1
            curl -fs --max-time 2 http://127.0.0.1:8899/health >/dev/null 2>&1 && embedding_ready=1
            curl -fs --max-time 2 http://127.0.0.1:8898/health >/dev/null 2>&1 && rerank_ready=1

            if [ "$qdrant_ready" = "1" ] && [ "$embedding_ready" = "1" ] && [ "$rerank_ready" = "1" ]; then
              ready=1
              echo "Qdrant, embedding TEI and reranker TEI are ready."
              break
            fi

            if [ "$i" = "1" ] || [ $((i % 6)) -eq 0 ]; then
              elapsed=$((i * 10))
              echo "Still loading after approximately ${elapsed}s: qdrant=$qdrant_ready embedding=$embedding_ready rerank=$rerank_ready"
              docker ps --filter 'name=bench-' --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
              echo "--- embedding log tail ---"
              docker logs --tail 12 bench-embedding 2>&1 || true
              echo "--- reranker log tail ---"
              docker logs --tail 12 bench-rerank 2>&1 || true
            fi
            sleep 10
          done

          if [ "$ready" != "1" ]; then
            echo "::error::Retrieval services did not become ready within 30 minutes"
            docker logs --tail 200 bench-qdrant || true
            docker logs --tail 200 bench-embedding || true
            docker logs --tail 200 bench-rerank || true
            exit 1
          fi

      - name: Run live benchmark suites
        working-directory: src/py-engine
        run: uv run --frozen python -m agentic_circuit.benchmarks.runner

      - name: Enforce deterministic memory safety
        run: python scripts/check_live_benchmark.py benchmark-results/live/benchmark-results.json

      - name: Persist benchmark metrics to Neon
        timeout-minutes: 5
        working-directory: src/py-engine
        run: |
          uv run --with 'psycopg[binary]>=3.2,<4' \
            python -m agentic_circuit.benchmarks.postgres_registry \
            --result "$GITHUB_WORKSPACE/benchmark-results/live/benchmark-results.json" \
            --report "$GITHUB_WORKSPACE/benchmark-results/live/benchmark-report.md" \
            --category "$BENCH_REGISTRY_CATEGORY" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow-run-number "$GITHUB_RUN_NUMBER" \
            --event-name "$GITHUB_EVENT_NAME" \
            --git-ref "$GITHUB_REF"

      - name: Publish job summary
        if: always()
        run: |
          if [ -f benchmark-results/live/benchmark-report.md ]; then
            cat benchmark-results/live/benchmark-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Benchmark report was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark report
        if: ${{ always() && hashFiles('benchmark-results/live/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: live-memory-benchmark-${{ github.run_number }}
          path: benchmark-results/live
          if-no-files-found: error
          retention-days: 90

      - name: Print service logs on failure or cancellation
        if: ${{ always() && (failure() || cancelled()) }}
        run: |
          docker logs --tail 200 bench-qdrant || true
          docker logs --tail 200 bench-embedding || true
          docker logs --tail 200 bench-rerank || true

      - name: Normalize cache ownership
        if: always()
        run: sudo chown -R "$USER":"$USER" .cache || true
