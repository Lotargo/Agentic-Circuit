name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade uv
      - name: Verify lockfile
        working-directory: src/py-engine
        run: uv lock --check
      - name: Install locked engine and tests
        working-directory: src/py-engine
        run: uv sync --frozen --extra test
      - name: Run pytest
        working-directory: src/py-engine
        run: |
          set +e
          uv run --frozen pytest -q --tb=short > ../../pytest-report.txt 2>&1
          status=$?
          cat ../../pytest-report.txt
          exit $status
      - name: Upload pytest report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.txt
          if-no-files-found: error

  typescript:
    name: TypeScript build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/ts-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/ts-gateway/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  containers:
    name: Compose and Docker builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Build Python engine image
        run: docker build -f src/py-engine/Dockerfile -t chat-openwebui-py-engine:ci .
      - name: Build TypeScript gateway image
        run: docker build -f src/ts-gateway/Dockerfile -t chat-openwebui-ts-gateway:ci .

  smoke:
    name: Gateway to engine smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install --upgrade uv
      - name: Install services
        run: |
          cd src/py-engine
          uv sync --frozen
          cd ../ts-gateway
          npm ci
          npm run build
      - name: Prepare isolated provider configuration
        run: |
          cp -R config /tmp/agentic-config
          cat > /tmp/agentic-config/providers.yaml <<'YAML'
          providers:
            opencode-zen:
              type: openai-compatible
              base_url: http://127.0.0.1:18080/v1
              api_key_env: OPENCODE_ZEN_API_KEY
              models: [big-pickle, mimo-v2.5-free]
          YAML
      - name: Start mock provider, engine and gateway
        env:
          CONFIG_DIR: /tmp/agentic-config
          OPENCODE_ZEN_API_KEY: smoke-key
          QDRANT_URL: http://127.0.0.1:16633
          EMBEDDING_SIDECAR_URL: http://127.0.0.1:18899
          PY_ENGINE_URL: http://127.0.0.1:8823
          TS_GATEWAY_PORT: "9191"
        run: |
          python scripts/ci_mock_provider.py >/tmp/mock.log 2>&1 &
          (cd src/py-engine && uv run --frozen uvicorn agentic_circuit.main:app --host 127.0.0.1 --port 8823) >/tmp/engine.log 2>&1 &
          (cd src/ts-gateway && node dist/index.js) >/tmp/gateway.log 2>&1 &
          ready=0
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:9191/v1/models | grep -q 'agentic-circuit'; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = "1"
      - name: Verify OpenAI flow, header forwarding and memory lifecycle
        run: |
          common_headers=(
            -H 'content-type: application/json'
            -H 'X-OpenWebUI-User-Id: smoke-user'
            -H 'X-OpenWebUI-Workspace-Id: smoke-workspace'
            -H 'X-Project-Id: smoke-project'
            -H 'X-OpenWebUI-Chat-Id: smoke-chat'
          )
          first=$(curl -fsS http://127.0.0.1:9191/v1/chat/completions \
            "${common_headers[@]}" \
            -d '{"model":"agentic-circuit","prism":"joy","messages":[{"role":"user","content":"Меня зовут Олег"}]}')
          echo "$first" | grep -q 'SMOKE_OK'

          second=$(curl -fsS http://127.0.0.1:9191/v1/chat/completions \
            "${common_headers[@]}" \
            -d '{"model":"agentic-circuit","prism":"joy","messages":[{"role":"user","content":"Меня зовут Олег"},{"role":"assistant","content":"Запомнила"},{"role":"user","content":"Как меня зовут?"}]}')
          echo "$second"
          echo "$second" | grep -q 'SMOKE_OK'
      - name: Print logs on failure
        if: failure()
        run: |
          cat /tmp/mock.log || true
          cat /tmp/engine.log || true
          cat /tmp/gateway.log || true
