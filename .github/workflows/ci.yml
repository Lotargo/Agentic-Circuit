name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install engine with test dependencies
        run: uv pip install --system -e "src/py-engine[test]"
      - name: Run pytest
        run: pytest -q src/py-engine/tests

  typescript:
    name: TypeScript build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/ts-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/ts-gateway/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  containers:
    name: Compose and Docker builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Build Python engine image
        run: docker build -f src/py-engine/Dockerfile -t chat-openwebui-py-engine:ci .
      - name: Build TypeScript gateway image
        run: docker build -f src/ts-gateway/Dockerfile -t chat-openwebui-ts-gateway:ci .
