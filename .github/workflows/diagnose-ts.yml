name: Capture TypeScript diagnostics

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-ts.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Capture output
        working-directory: src/ts-gateway
        run: |
          npm ci
          npm run typecheck > ../../docs/ts-diagnostics.txt 2>&1 || true
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ts-diagnostics.txt
          git commit -m "chore: capture TypeScript diagnostics" || exit 0
          git push
