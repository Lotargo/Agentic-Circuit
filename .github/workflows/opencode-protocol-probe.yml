name: OpenCode protocol probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
      OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
      PROBE_OUTPUT_DIR: ${{ github.workspace }}/protocol-probe-results

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify Zen key
        shell: bash
        run: |
          test -n "$OPENCODE_ZEN_API_KEY" || {
            echo "OPENCODE_ZEN_API_KEY is not configured"
            exit 1
          }
          echo "::add-mask::$OPENCODE_ZEN_API_KEY"
          [ -n "${OPENCODE_GO_API_KEY:-}" ] && echo "::add-mask::$OPENCODE_GO_API_KEY"

      - name: Install probe dependencies
        run: python -m pip install 'httpx>=0.27,<1' 'openai>=1.40,<3'

      - name: Probe raw and SDK response protocols
        working-directory: src/py-engine
        run: python scripts/probe_opencode_protocols.py

      - name: Publish probe summary
        if: always()
        run: |
          if [ -f protocol-probe-results/opencode-protocol-probe.md ]; then
            cat protocol-probe-results/opencode-protocol-probe.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Protocol probe report was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload protocol probe artifact
        if: ${{ always() && hashFiles('protocol-probe-results/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: opencode-protocol-probe-${{ github.run_number }}
          path: protocol-probe-results
          if-no-files-found: error
          retention-days: 30
