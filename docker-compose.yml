# Agentic circuit — full local stack (docker-compose).
#
# Every component is an independent container on a shared network and talks over
# HTTP. Service-to-service URLs use Docker service names (qdrant, mongodb, ...).
# Host-to-service ports are mapped per docs/superpowers/specs (section 10).
#
# Inference (TEI embedding / ColBERT rerank) runs on GPU when available and
# transparently falls back to CPU otherwise — no image rebuild required.

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6633:6333"   # REST
      - "6634:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [agentic]
    restart: unless-stopped

  mongodb:
    image: mongo:7
    ports:
      - "27617:27017"
    volumes:
      - mongo_data:/data/db
    networks: [agentic]
    restart: unless-stopped

  tei-embedding:
    # TEI CPU image by default; switch to the GPU tag when CUDA is present.
    # GPU tag example: ghcr.io/huggingface/text-embeddings-inference:1.5
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.5}
    ports:
      - "8899:80"
    environment:
      MODEL_ID: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      # For GPU, also pass:
      # DEPLOYMENT_INFERENCE_PRECISION: fp16
    # GPU (auto-ignored on CPU-only hosts):
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks: [agentic]
    restart: unless-stopped

  colbert-rerank:
    # Provide a ColBERT late-interaction rerank serving image.
    # Replace with your hosted rerank server image; CPU/GPU handled by that image.
    image: ${RERANK_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.5}
    ports:
      - "8898:80"
    environment:
      MODEL_ID: ${RERANK_MODEL:-answerdotai/colbert-small-v1}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks: [agentic]
    restart: unless-stopped

  py-engine:
    build:
      context: .
      dockerfile: src/py-engine/Dockerfile
    ports:
      - "8823:8823"
    env_file: [.env]
    environment:
      # Service-to-service URLs (override host-localhost .env values):
      QDRANT_URL: http://qdrant:6333
      MONGODB_URL: mongodb://mongodb:27017
      EMBEDDING_SIDECAR_URL: http://tei-embedding:80
      RERANK_SIDECAR_URL: http://colbert-rerank:80
      PY_ENGINE_URL: http://py-engine:8823
      PY_ENGINE_PORT: "8823"
    depends_on: [qdrant, mongodb, tei-embedding, colbert-rerank]
    networks: [agentic]
    restart: unless-stopped

  ts-gateway:
    build:
      context: .
      dockerfile: src/ts-gateway/Dockerfile
    ports:
      - "9191:9191"
    env_file: [.env]
    environment:
      PY_ENGINE_URL: http://py-engine:8823
      TS_GATEWAY_PORT: "9191"
    depends_on: [py-engine]
    networks: [agentic]
    restart: unless-stopped

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "3200:8080"
    environment:
      # Point OpenWebUI at our OpenAI-compatible TS gateway.
      OPENAI_API_BASE_URL: http://ts-gateway:9191/v1
      OPENAI_API_KEY: dummy
    depends_on: [ts-gateway]
    volumes:
      - openwebui_data:/app/backend/data
    networks: [agentic]
    restart: unless-stopped

networks:
  agentic:
    driver: bridge

volumes:
  qdrant_data:
  mongo_data:
  openwebui_data:
