# Agentic Circuit — CPU-first local stack.
# GPU images/device reservations live in docker-compose.gpu.yml.
# Internal retrieval and engine services are intentionally not published to the host.

services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    expose:
      - "6333"
      - "6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [agentic]
    restart: unless-stopped

  tei-embedding:
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9}
    expose:
      - "80"
    environment:
      MODEL_ID: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
    volumes:
      - tei_embedding_data:/data
    networks: [agentic]
    restart: unless-stopped

  tei-rerank:
    image: ${RERANK_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9}
    expose:
      - "80"
    environment:
      MODEL_ID: ${RERANK_MODEL:-Alibaba-NLP/gte-multilingual-reranker-base}
    volumes:
      - tei_rerank_data:/data
    networks: [agentic]
    restart: unless-stopped

  py-engine:
    build:
      context: .
      dockerfile: src/py-engine/Dockerfile
    expose:
      - "8823"
    env_file: [.env]
    environment:
      CONFIG_DIR: /app/config
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_SIDECAR_URL: http://tei-embedding:80
      RERANK_SIDECAR_URL: http://tei-rerank:80
      EMBEDDING_VECTOR_SIZE: ${EMBEDDING_VECTOR_SIZE:-384}
      PY_ENGINE_PORT: "8823"
    volumes:
      - ./config:/app/config:ro
    depends_on:
      - qdrant
      - tei-embedding
      - tei-rerank
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8823/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    networks: [agentic]
    restart: unless-stopped

  ts-gateway:
    build:
      context: .
      dockerfile: src/ts-gateway/Dockerfile
    ports:
      - "127.0.0.1:9191:9191"
    env_file: [.env]
    environment:
      PY_ENGINE_URL: http://py-engine:8823
      TS_GATEWAY_PORT: "9191"
      PROVIDERS_YAML: /app/config/providers.yaml
      PROVIDERS_ADMIN_TOKEN: ${PROVIDERS_ADMIN_TOKEN:-}
    volumes:
      - ./config:/app/config
    depends_on:
      py-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:9191/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    networks: [agentic]
    restart: unless-stopped

  openwebui:
    image: ghcr.io/open-webui/open-webui:v0.11.1
    ports:
      - "127.0.0.1:3200:8080"
    environment:
      OPENAI_API_BASE_URL: http://ts-gateway:9191/v1
      OPENAI_API_KEY: dummy
    depends_on:
      ts-gateway:
        condition: service_healthy
    volumes:
      - openwebui_data:/app/backend/data
    networks: [agentic]
    restart: unless-stopped

networks:
  agentic:
    driver: bridge

volumes:
  qdrant_data:
  tei_embedding_data:
  tei_rerank_data:
  openwebui_data:
